<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="page-fade">

<nav class="sleek-nav">
  <div class="nav-container">
    <a href="dashboard.html" class="brand">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 20L9 6L13 15L16 9L21 20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Trailhead
    </a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <a href="#" data-logout class="logout-link">Logout</a>
      <button class="icon-btn" id="mobileMenuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="sleek-mobile-menu" id="mobileMenu">
  <div class="menu-grid">
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="career-advisor.html">Career Advisor</a>
    <a href="learning-planner.html">Learning Planner</a>

    <a href="video-meet.html">Video Meet</a>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow" style="justify-content:center;">Almost there</span>
    <h2>Reset password</h2>
    <p class="auth-sub">Choose a new password for your account.</p>

    <div class="form-error" id="errorBanner"></div>
    <div class="form-success" id="successBanner"></div>

    <form id="resetPasswordForm">
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" placeholder="Re-enter your new password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset password</button>
    </form>

    <div class="auth-switch">Remembered it after all? <a href="login.html">Back to log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
  // Sleek Menu Toggle
  document.addEventListener('DOMContentLoaded', () => {
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenuBtn && mobileMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('active');
      });
    }
  });
</script>

</body>
</html>
