<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow" style="justify-content:center;">Waypoint 0</span>
    <h2>Create your account</h2>
    <p class="auth-sub">Start mapping your path in under a minute.</p>

    <div class="form-error" id="errorBanner"></div>

    <form id="registerForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="e.g. R K Suriya Narayanan" required minlength="2">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>

    <div class="auth-divider" style="text-align: center; margin: 24px 0; position: relative;">
      <hr style="border: 0; border-top: 1px solid var(--line); margin: 0;">
      <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--pine-900); padding: 0 10px; color: var(--stone); font-size: 0.9rem;">or</span>
    </div>
    <div id="googleAuthContainer" style="display:flex; justify-content:center; margin-bottom:16px; min-height: 40px;"></div>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
  // Sleek Menu Toggle
  document.addEventListener('DOMContentLoaded', () => {
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenuBtn && mobileMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('active');
      });
    }
  });

  async function handleGoogleLogin(response) {
    try {
      const result = await apiRequest("/api/auth/google", {
        method: "POST",
        body: { credential: response.credential },
        skipAuth: true
      });
      Auth.setSession(result.access_token, { id: result.user_id, name: result.name, email: result.email });
      window.location.href = "dashboard.html";
    } catch (err) {
      const errorBanner = document.getElementById('errorBanner');
      errorBanner.textContent = err.message || 'Google Sign-In failed';
      errorBanner.classList.add('visible');
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const config = await apiRequest('/api/config', { skipAuth: true });
      if (config && config.google_client_id && config.google_client_id !== "YOUR_GOOGLE_CLIENT_ID_HERE") {
        
        function initGoogle() {
          if (typeof google === 'undefined' || !google.accounts) {
            setTimeout(initGoogle, 100);
            return;
          }
          google.accounts.id.initialize({
            client_id: config.google_client_id,
            callback: handleGoogleLogin
          });
          google.accounts.id.renderButton(
            document.getElementById("googleAuthContainer"),
            { theme: "filled_blue", size: "large", width: 330, shape: "pill" }
          );
        }
        initGoogle();

      } else {
        document.getElementById("googleAuthContainer").innerHTML = '<p class="hint" style="color:var(--stone)">Google Login is not configured. Add GOOGLE_CLIENT_ID.</p>';
      }
    } catch (err) {
      console.warn("Failed to load Google config", err);
    }
  });
</script>

</body>
</html>
