<head>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="page-fade">

<nav class="sleek-nav">
  <div class="nav-container">
    <a href="dashboard.html" class="brand">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 20L9 6L13 15L16 9L21 20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Trailhead
    </a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <a href="#" data-logout class="logout-link">Logout</a>
      <button class="icon-btn" id="mobileMenuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="sleek-mobile-menu" id="mobileMenu">
  <div class="menu-grid">
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="career-advisor.html">Career Advisor</a>
    <a href="learning-planner.html">Learning Planner</a>

    <a href="group-chat.html">Group Chat</a>
    <a href="video-meet.html">Video Meet</a>
    <a href="certificate.html">Certificate</a>
  </div>
</div>




<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow" style="justify-content:center;">Waypoint 0</span>
    <h2>Create your account</h2>
    <p class="auth-sub">Start mapping your path in under a minute.</p>

    <div class="form-error" id="errorBanner"></div>

    <form id="registerForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="e.g. R K Suriya Narayanan" required minlength="2">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
  // Sleek Menu Toggle
  document.addEventListener('DOMContentLoaded', () => {
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenuBtn && mobileMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('active');
      });
    }
  });
</script>

</body>
</html>
